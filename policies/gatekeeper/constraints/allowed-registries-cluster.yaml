apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: allowed-image-registries
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system        # avoid bootstrap deadlock
  parameters:
    repos:
      # Application
      - "docker.io/reonbritto/"
      # Cluster + cert-manager
      - "registry.k8s.io/"
      - "quay.io/jetstack/"
      # cosign / Sigstore tooling
      - "gcr.io/projectsigstore/"
      # Gatekeeper
      - "openpolicyagent/"
      - "ghcr.io/open-policy-agent/"
      # Istio
      - "docker.io/istio/"
      # Argo CD
      - "quay.io/argoproj/"
      - "ghcr.io/dexidp/"
      # External Secrets Operator
      - "ghcr.io/external-secrets/"
      # ExternalDNS
      - "registry.k8s.io/external-dns/"
      # LGTM stack — both fully-qualified and bare DockerHub forms
      # (Gatekeeper matches the literal string in the pod spec; charts
      # often use bare `kiwigrid/k8s-sidecar` etc. without docker.io/ prefix)
      - "docker.io/grafana/"
      - "grafana/"
      - "docker.io/prom/"
      - "prom/"
      - "quay.io/prometheus/"
      - "quay.io/prometheus-operator/"
      - "quay.io/kiwigrid/"
      - "kiwigrid/"
      - "docker.io/memcached"
      - "memcached"
      - "docker.io/library/memcached"
      - "docker.io/nginxinc/"
      - "nginxinc/"
      # OTel
      - "docker.io/otel/"
      - "otel/"
      # Redis (Argo CD dep)
      - "docker.io/redis"
      - "docker.io/library/redis"
      - "redis"
      # Bitnami (a few charts use this)
      - "docker.io/bitnami/"
      - "bitnami/"
      # busybox (init containers)
      - "docker.io/library/busybox"
      - "busybox"
      # bats/bats (Helm test pods)
      - "docker.io/bats/"
      - "bats/"

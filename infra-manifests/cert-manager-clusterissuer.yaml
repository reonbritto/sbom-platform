# Let's Encrypt STAGING ClusterIssuer.
# DNS-01 challenge against Azure DNS (reon.buzz, RG `sa`).
# Uses the ExternalDNS managed identity (already has DNS Zone Contributor).
#
# IMPORTANT: when using `managedIdentity`, do NOT also set tenantID, clientID,
# or clientSecretSecretRef. The webhook rejects mixing the two auth modes.
#
# To flip to PROD later: change the server URL + privateKeySecretRef name,
# then delete the existing reon-buzz-tls Secret in istio-system so cert-manager
# re-issues from the prod ACME endpoint.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: reonbritto@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: dfed6615-05cd-434d-b0e0-7dea9e050738
            resourceGroupName: sa
            hostedZoneName: reon.buzz
            managedIdentity:
              clientID: 4aed8159-86ef-4f44-a872-d5ce34fb9578
        selector:
          dnsZones:
            - reon.buzz

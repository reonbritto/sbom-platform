# Cluster-scoped ESO secret store pointing at Azure Key Vault.
# All ExternalSecret resources across the cluster reference this by name.
# Auth: Workload Identity via the eso-service-account in the external-secrets ns.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-sbom-dev-bxb3q.vault.azure.net/
      # No `tenantId:` here — the eso-service-account already carries
      # `azure.workload.identity/tenant-id` annotation. Setting both makes
      # ESO refuse the store with "multiple tenantID found".
      serviceAccountRef:
        name: eso-service-account
        namespace: external-secrets

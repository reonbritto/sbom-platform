# IP allowlist for the Argo CD UI. Only 37.60.98.75 can reach argocd.reon.buzz.
# Everyone else gets 403 at the ingress gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: argocd-ip-allowlist
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            remoteIpBlocks: ["37.60.98.75/32"]
      to:
        - operation:
            hosts: ["argocd.reon.buzz"]

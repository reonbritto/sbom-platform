# Pulls gf-admin-password from Key Vault into a K8s Secret named `grafana-admin`
# (referenced by kube-prometheus-stack-values.yaml grafana.admin.existingSecret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    template:
      data:
        admin-user: "admin"
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: gf-admin-password

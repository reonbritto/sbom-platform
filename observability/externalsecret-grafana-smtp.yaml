# Pulls SMTP creds from KV into K8s Secret `grafana-smtp` for Grafana
# (referenced by kube-prometheus-stack-values.yaml grafana.smtp.existingSecret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-smtp
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: grafana-smtp
  data:
    - secretKey: user
      remoteRef:
        key: alertmanager-smtp-username
    - secretKey: password
      remoteRef:
        key: alertmanager-smtp-password

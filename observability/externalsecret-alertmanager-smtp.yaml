# SMTP password for Alertmanager (mounted into the AM pod via additionalSecrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp
  data:
    - secretKey: username
      remoteRef:
        key: alertmanager-smtp-username
    - secretKey: password
      remoteRef:
        key: alertmanager-smtp-password

apiVersion: batch/v1
kind: CronJob
metadata:
  name: kev-rescan
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: kev-rescan
              env:
                - name: DATABASE_URL
                  value: "postgresql://sbomapp@psql-sbom-dev:$(POSTGRES_APP_PASSWORD)@psql-sbom-dev.privatelink.postgres.database.azure.com:5432/sbom?sslmode=require"
                - name: REDIS_URL
                  value: "rediss://:$(REDIS_PRIMARY_KEY)@redis-sbom-dev.privatelink.redis.cache.windows.net:6380"

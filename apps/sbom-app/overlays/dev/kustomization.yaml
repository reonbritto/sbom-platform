apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sbom

commonAnnotations:
  app.sbom/environment: dev

resources:
  - ../../base

patches:
  - path: replicas-patch.yaml
    target: { kind: Deployment, name: sbom-app }
  - path: pdb-patch.yaml
    target: { kind: PodDisruptionBudget, name: sbom-app }
  - path: hpa-patch.yaml
    target: { kind: HorizontalPodAutoscaler, name: sbom-app }
  - path: env-patch.yaml
    target: { kind: Deployment, name: sbom-app }
  - path: cronjob-env-patch.yaml
    target: { kind: CronJob, name: kev-rescan }
  - path: serviceaccount-patch.yaml
    target: { kind: ServiceAccount, name: sbom-app }

images:
  # Harness rewrites newTag on each release. Initial value is a known-bad placeholder
  # so a fresh ArgoCD sync will fail loudly until the first deploy lands a real digest.
  - name: sbom-app
    newName: docker.io/reonbritto/sbom-vuln-analyzer
    newTag: bootstrap
  - name: kev-rescan
    newName: docker.io/reonbritto/kev-rescan
    newTag: bootstrap

apiVersion: batch/v1
kind: CronJob
metadata:
  name: kev-rescan
spec:
  schedule: "30 3 * * *" # 03:30 daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kev-rescan
            app.kubernetes.io/part-of: sbom-vuln-analyzer
            azure.workload.identity/use: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: sbom-app
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: kev-rescan
              image: kev-rescan:placeholder # patched per env
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: { name: sbom-app-config }
                - secretRef: { name: sbom-app-secrets }
              env:
                - name: DATABASE_URL
                  value: "" # patched per env
                - name: REDIS_URL
                  value: "" # patched per env
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sbom-app-kv
spec:
  provider: azure
  parameters:
    # Patched per env to point at kv-sbom-{dev|prod}
    keyvaultName: "kv-sbom-PLACEHOLDER"
    tenantId: "PLACEHOLDER"
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Workload identity client comes from the SA annotation
    objects: |
      array:
        - |
          objectName: better-auth-secret
          objectType: secret
        - |
          objectName: postgres-app-password
          objectType: secret
        - |
          objectName: redis-primary-key
          objectType: secret
        - |
          objectName: openobserve-ingest-key
          objectType: secret
  secretObjects:
    - secretName: sbom-app-secrets
      type: Opaque
      data:
        - objectName: better-auth-secret
          key: BETTER_AUTH_SECRET
        - objectName: postgres-app-password
          key: POSTGRES_APP_PASSWORD
        - objectName: redis-primary-key
          key: REDIS_PRIMARY_KEY
        - objectName: openobserve-ingest-key
          key: OPENOBSERVE_INGEST_KEY

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sbom-app
spec:
  parentRefs:
    - name: sbom-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "sbom.example.com" # patched per env
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sbom-app
          port: 3000
          weight: 100
      timeouts:
        request: 30s
        backendRequest: 30s

# Pulls Key Vault secrets into a K8s Secret named `sbom-app-secrets`
# (referenced by the Deployment's envFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sbom-app-secrets
  namespace: sbom
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: sbom-app-secrets
  data:
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: service-api-key

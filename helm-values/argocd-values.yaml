# Argo CD Helm values
# Chart: argo/argo-cd

global:
  domain: argocd.reon.buzz

configs:
  params:
    # Argo's server is behind Istio's TLS — let Argo serve plaintext internally.
    server.insecure: true

  cm:
    # Enable Dex / OIDC later if needed; for now local admin.
    url: https://argocd.reon.buzz
    statusbadge.enabled: "true"
    timeout.reconciliation: 60s

  # No custom rbac block. Argo's built-in `admin` local user is unconditionally
  # cluster-admin out of the box. Add `policy.csv` only when you wire up SSO
  # and need to grant roles to OIDC groups — setting `policy.default: ""` here
  # without a working group mapping locks YOU out (the local admin user falls
  # under the empty default, not under any `g, ...` group binding).

server:
  replicas: 1
  service:
    type: ClusterIP
  # No ingress here — Istio VirtualService in ingress/argocd-virtualservice.yaml
  # handles external traffic.
  ingress:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

dex:
  enabled: false

notifications:
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

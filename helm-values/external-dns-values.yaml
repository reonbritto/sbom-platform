# ExternalDNS Helm values
# Chart: external-dns/external-dns
#
# Watches Istio Gateway + VirtualService + Service objects and writes A records
# into the reon.buzz Azure DNS zone (RG `sa`).

provider:
  name: azure

sources:
  - service
  - ingress
  - istio-gateway
  - istio-virtualservice

domainFilters:
  - reon.buzz

# Don't touch records ExternalDNS didn't create
policy: sync
registry: txt
txtOwnerId: aks-sbom
txtPrefix: extdns-

azure:
  tenantId: "d1d16433-e375-4076-a7ea-c57bb79df0de"
  subscriptionId: "dfed6615-05cd-434d-b0e0-7dea9e050738"
  resourceGroup: sa
  useWorkloadIdentityExtension: true

serviceAccount:
  create: true
  name: external-dns-sa
  annotations:
    azure.workload.identity/client-id: "4aed8159-86ef-4f44-a872-d5ce34fb9578"
    azure.workload.identity/tenant-id: "d1d16433-e375-4076-a7ea-c57bb79df0de"
  labels:
    azure.workload.identity/use: "true"

podLabels:
  azure.workload.identity/use: "true"

env:
  - name: AZURE_CLIENT_ID
    value: "4aed8159-86ef-4f44-a872-d5ce34fb9578"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: true

interval: 1m
logLevel: info

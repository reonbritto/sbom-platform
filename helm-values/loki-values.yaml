# Loki Helm values (distributed mode, Azure Blob backend)
# Chart: grafana/loki
#
# Stores logs in the `loki` container of the observability storage account.
# Authenticates via Workload Identity (federated credential bound to obs-sa).

deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  # Schema: TSDB index, Azure Blob chunks
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: azure
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    azure:
      accountName: stsbomobsr4tm8a
      containerName: loki
      endpointSuffix: blob.core.windows.net
      useFederatedToken: true

  commonConfig:
    replication_factor: 1

  limits_config:
    retention_period: 30d
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

# ─────────────────────────────────────────────────────────
#  Service account (shared with Tempo + Mimir)
# ─────────────────────────────────────────────────────────
# Loki creates the shared `obs-sa`. Tempo and Mimir reference it without creating.
serviceAccount:
  create: true
  name: obs-sa
  annotations:
    azure.workload.identity/client-id: "b32805f9-f8b8-4b93-993f-2b3f83e936c8"
    azure.workload.identity/tenant-id: "d1d16433-e375-4076-a7ea-c57bb79df0de"
  labels:
    azure.workload.identity/use: "true"

# Pod labels — required for the WI webhook to inject the projected token volume
write:
  replicas: 1
  podLabels:
    azure.workload.identity/use: "true"
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

read:
  replicas: 1
  podLabels:
    azure.workload.identity/use: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

backend:
  replicas: 1
  podLabels:
    azure.workload.identity/use: "true"
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Disable internal monitoring chart — kube-prometheus-stack handles it
monitoring:
  enabled: false

# Disable test pod
test:
  enabled: false

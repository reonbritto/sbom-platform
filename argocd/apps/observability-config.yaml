# Glue manifests for the observability stack:
#   - ESO ExternalSecret for Grafana admin (KV → grafana-admin Secret)
#   - ESO ExternalSecret for Grafana SMTP (KV → grafana-smtp Secret)
#   - ESO ExternalSecret for Alertmanager SMTP password (KV → alertmanager-smtp Secret)
#   - Grafana datasources ConfigMap (Loki, Tempo, Mimir)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: default
  source:
    repoURL: https://github.com/reonbritto/sbom-platform.git
    targetRevision: main
    path: observability
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

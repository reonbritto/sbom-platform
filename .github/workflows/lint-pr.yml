name: Lint PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            ci
            chore
            revert
            security
          scopes: |
            chart
            base
            dev
            argocd
            policy
            infra
            ci
            deps
          requireScope: false
          subjectPattern: '^(?![A-Z]).+$'
